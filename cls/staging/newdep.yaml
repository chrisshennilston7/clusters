apiVersion: apps/v1
kind: Deployment
metadata:
  name: newdata
  namespace: flux-system
spec:
  replicas: 3
  selector:
    matchLabels:
      app: newdata
  template:
    metadata:
      labels:
        app: newdata
    spec:
      containers:
        - name: nginx
          image: nginx:1.28
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"